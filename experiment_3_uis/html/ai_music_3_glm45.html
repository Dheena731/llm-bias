<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamWave - Music Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 375px;
            height: 812px;
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #ffffff;
            position: relative;
        }
        
        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #6b46c1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: url('https://picsum.photos/seed/user1/36/36.jpg') center/cover;
            border: 2px solid #6b46c1;
        }
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }
        
        .hero-section {
            margin: 20px;
            background: linear-gradient(135deg, #6b46c1 0%, #ec4899 100%);
            border-radius: 16px;
            padding: 24px;
            height: 200px;
            position: relative;
            overflow: hidden;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
        }
        
        .hero-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .hero-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .hero-decoration {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .view-all {
            color: #6b46c1;
            font-size: 14px;
            text-decoration: none;
        }
        
        .music-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            margin: 0 20px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: background 0.2s;
        }
        
        .music-card:hover {
            background: #252525;
        }
        
        .album-art {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
        }
        
        .track-info {
            flex: 1;
        }
        
        .track-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .artist-name {
            font-size: 14px;
            color: #999;
        }
        
        .play-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6b46c1;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .play-button:hover {
            background: #7c3aed;
        }
        
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 0 20px;
        }
        
        .playlist-item {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        
        .playlist-image {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            margin-bottom: 12px;
            background-size: cover;
            background-position: center;
        }
        
        .playlist-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .playlist-tracks {
            font-size: 12px;
            color: #666;
        }
        
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a0a0a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #666;
            text-decoration: none;
            font-size: 12px;
            padding: 8px 16px;
        }
        
        .nav-item.active {
            color: #6b46c1;
        }
        
        .nav-icon {
            font-size: 20px;
        }
        
        .current-player {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .current-song-art {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
        }
        
        .current-song-info {
            flex: 1;
        }
        
        .current-song-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .current-song-artist {
            font-size: 12px;
            color: #666;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
        }
        
        .control-btn.play-pause {
            color: #6b46c1;
            font-size: 20px;
        }
        
        .progress-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            margin: 12px 0;
            position: relative;
            cursor: pointer;
        }
        
        .progress-fill {
            height: 100%;
            background: #6b46c1;
            border-radius: 2px;
            width: 35%;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">StreamWave</div>
            <div class="user-avatar"></div>
        </header>
        
        <main class="main-content">
            <div class="hero-section">
                <div class="hero-content">
                    <h2 class="hero-title">Good Morning</h2>
                    <p class="hero-subtitle">Here's your daily mix</p>
                </div>
                <div class="hero-decoration"></div>
            </div>
            
            <h3 class="section-title">
                Recently Played
                <a href="#" class="view-all">See all</a>
            </h3>
            
            <div class="music-card">
                <div class="album-art" style="background-image: url('https://picsum.photos/seed/album1/56/56.jpg')"></div>
                <div class="track-info">
                    <div class="track-name">Blinding Lights</div>
                    <div class="artist-name">The Weeknd</div>
                </div>
                <button class="play-button">▶</button>
            </div>
            
            <div class="music-card">
                <div class="album-art" style="background-image: url('https://picsum.photos/seed/album2/56/56.jpg')"></div>
                <div class="track-info">
                    <div class="track-name">Stay</div>
                    <div class="artist-name">The Kid LAROI, Justin Bieber</div>
                </div>
                <button class="play-button">▶</button>
            </div>
            
            <div class="music-card">
                <div class="album-art" style="background-image: url('https://picsum.photos/seed/album3/56/56.jpg')"></div>
                <div class="track-info">
                    <div class="track-name">Levitating</div>
                    <div class="artist-name">Dua Lipa</div>
                </div>
                <button class="play-button">▶</button>
            </div>
            
            <h3 class="section-title">
                Made For You
                <a href="#" class="view-all">See all</a>
            </h3>
            
            <div class="playlist-grid">
                <div class="playlist-item">
                    <div class="playlist-image" style="background-image: url('https://picsum.photos/seed/playlist1/160/120.jpg')"></div>
                    <div class="playlist-name">Discover Weekly</div>
                    <div class="playlist-tracks">30 songs</div>
                </div>
                <div class="playlist-item">
                    <div class="playlist-image" style="background-image: url('https://picsum.photos/seed/playlist2/160/120.jpg')"></div>
                    <div class="playlist-name">Release Radar</div>
                    <div class="playlist-tracks">25 songs</div>
                </div>
            </div>
        </main>
        
        <div class="current-player">
            <div class="current-song-art" style="background-image: url('https://picsum.photos/seed/current/56/56.jpg')"></div>
            <div class="current-song-info">
                <div class="current-song-name">Watermelon Sugar</div>
                <div class="current-song-artist">Harry Styles</div>
            </div>
            <div class="player-controls">
                <button class="control-btn">⏮</button>
                <button class="control-btn play-pause">⏸</button>
                <button class="control-btn">⏭</button>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🔍</span>
                <span>Search</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📚</span>
                <span>Library</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Premium</span>
            </a>
        </nav>
    </div>
</body>
</html>
